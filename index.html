<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Desk – Salonplafond Saalplan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0c0a09; }
        ::-webkit-scrollbar-thumb { background: #292524; border-radius: 3px; }
        
        /* Salonplafond Yellow Cube Logo Animations */
        @keyframes cubeGlow {
            0%, 100% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.4), inset 0 0 8px rgba(255, 255, 255, 0.2); transform: scale(1) rotate(0deg); }
            50% { box-shadow: 0 0 22px rgba(245, 158, 11, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.4); transform: scale(1.03) rotate(2deg); }
        }
        .salon-cube-glow { animation: cubeGlow 4s infinite ease-in-out; }

        @keyframes iconSwapFade {
            0% { opacity: 0; transform: scale(0.7) rotate(-10deg); }
            15% { opacity: 1; transform: scale(1) rotate(0deg); }
            85% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.7) rotate(10deg); }
        }
        .icon-swap { animation: iconSwapFade 3.5s infinite ease-in-out; }

        .table-node {
            transition: transform 0.15s ease, border-color 0.15s ease;
            user-select: none;
        }
        .table-node:hover {
            transform: scale(1.05);
            z-index: 30;
        }
        .dragging {
            opacity: 0.5;
            transform: scale(1.1);
            z-index: 50 !important;
        }
        .drag-over {
            outline: 2px dashed #f59e0b !important;
            outline-offset: 4px;
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- HEADER / TOP BAR -->

        <div class="flex items-center space-x-3">

                <button onclick="changeDate(1)" class="text-stone-400 hover:text-amber-400 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- Shift Dropdown -->
            <div class="relative">
                <button onclick="toggleShiftDropdown()" class="bg-stone-950 border border-stone-800 px-3.5 py-1.5 rounded-lg text-stone-300 flex items-center gap-2 hover:border-stone-700 transition-colors">
                    <span id="currentShiftText">Ganzer Tag</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-stone-500"></i>
                </button>
                
                <div id="shiftDropdown" class="hidden absolute right-0 mt-2 w-40 bg-stone-900 border border-stone-800 rounded-xl shadow-2xl py-1 z-50 text-xs">
                    <button onclick="selectShift('Ganzer Tag')" class="w-full text-left px-3 py-2 hover:bg-stone-800 text-amber-400 font-semibold flex items-center gap-2">

                    <button onclick="selectShift('Mittagschicht')" class="w-full text-left px-3 py-2 hover:bg-stone-800 text-stone-300 flex items-center gap-2">

                </div>
            </div>

            <!-- POPUP CALENDAR MODAL -->

                <div class="flex justify-between items-center mb-3">

                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-stone-500 mb-1">

    </div>

    <!-- MODAL: NEUE RESERVIERUNG -->
    <div id="reservationModal" class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                <button onclick="closeReservationModal()" class="text-stone-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="newReservationForm" onsubmit="saveReservation(event)" class="space-y-4">

                    <label class="block text-xs font-semibold text-stone-400 mb-1 uppercase">Gast Name</label>
                    <input type="text" id="resName" required placeholder="z.B. Thomas Kardos" class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-xs text-stone-100 focus:outline-none focus:border-amber-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-stone-400 mb-1 uppercase">Personen (Pax)</label>
                        <input type="number" id="resPax" min="1" max="20" value="2" required class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-xs text-stone-100 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-400 mb-1 uppercase">Tisch</label>

                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-stone-400 mb-1 uppercase">Uhrzeit</label>
                        <input type="time" id="resTime" value="19:00" required class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-xs text-stone-100 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>

                    </div>

                <div class="pt-3 flex justify-end space-x-3 border-t border-stone-800">
                    <button type="button" onclick="closeReservationModal()" class="px-4 py-2 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-lg text-xs font-semibold">Abbrechen</button>
                    <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold rounded-lg text-xs shadow-lg">Reservierung Speichern</button>
                </div>
            </form>
        </div>
    </div>

        let selectedDate = new Date(2026, 9, 20);
        let draggedTableId = null;

        function renderFloorPlan() {
            const canvas = document.getElementById('floorPlanCanvas');
            canvas.innerHTML = '';

            tablesData.forEach(table => {
                const isCircle = table.shape === 'circle';
                const hasRes = table.res !== null;
                const customWidth = table.width ? `w-[${table.width}px]` : (isCircle ? 'w-16 h-16' : 'w-14 h-14');

                const node = document.createElement('div');
                node.id = `table-node-${table.id}`;
                node.setAttribute('draggable', 'true');
                node.className = `table-node absolute flex flex-col items-center justify-between p-1 cursor-grab shadow-lg ${
                    isCircle ? 'w-16 h-16 rounded-full' : (table.width ? 'h-14 rounded-xl' : 'w-14 h-14 rounded-xl')
                } ${
                    hasRes 
                        ? (table.res.badge === 'Belegt' ? 'bg-rose-950/80 border-2 border-rose-500' : 'bg-slate-800/90 border-2 border-teal-400')
                        : 'bg-slate-900 border border-slate-700 opacity-60'
                }`;

                node.style.top = `${table.top}px`;
                node.style.left = `${table.left}px`;
                if(table.width) node.style.width = `${table.width}px`;

                let resHeader = hasRes ? `<div class="bg-teal-400 text-slate-950 font-bold text-[8px] px-1 rounded-t w-full text-center leading-none py-0.5">${table.res.timeStart}</div>` : '';
                let resFooter = hasRes ? `<div class="text-[8px] px-1 rounded-b w-full text-center font-semibold leading-none py-0.5 ${table.res.badgeBg || 'bg-teal-500 text-slate-950'}">${table.res.badge || table.res.timeEnd}</div>` : '';
                let resName = hasRes ? `<span class="text-[9px] text-slate-200 font-bold truncate max-w-full px-1 bg-slate-950/80 rounded">${table.res.name}</span>` : `<span class="text-[8px] text-slate-500 italic">Frei</span>`;

                node.innerHTML = `
                    ${resHeader}
                    <div class="font-bold text-[11px] text-white my-auto flex items-center gap-1 leading-none">
                        ${table.id}
                    </div>
                    ${resName}
                    ${resFooter}
                `;

                node.addEventListener('dragstart', (e) => {
                    draggedTableId = table.id;
                    node.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', table.id);
                });

                node.addEventListener('dragend', () => {
                    node.classList.remove('dragging');
                    draggedTableId = null;
                });

                node.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    node.classList.add('drag-over');
                });

                node.addEventListener('dragleave', () => {
                    node.classList.remove('drag-over');
                });

                node.addEventListener('drop', (e) => {
                    e.preventDefault();
                    node.classList.remove('drag-over');
                    const targetTableId = table.id;

                    if (draggedTableId && draggedTableId !== targetTableId) {
                        swapTableReservations(draggedTableId, targetTableId);
                    }
                });

                canvas.appendChild(node);
            });

            renderSidebar();
            populateTableSelectOptions();
        }

        function swapTableReservations(sourceId, targetId) {
            const sourceTable = tablesData.find(t => t.id === sourceId);
            const targetTable = tablesData.find(t => t.id === targetId);

            if (sourceTable && targetTable) {
                const tempRes = sourceTable.res;
                sourceTable.res = targetTable.res;
                targetTable.res = tempRes;

                renderFloorPlan();
            }
        }

        function renderSidebar() {
            const listContainer = document.getElementById('reservationList');
            listContainer.innerHTML = '';
            let totalPax = 0;
            let resCount = 0;

            tablesData.filter(t => t.res !== null).forEach(t => {
                resCount++;
                totalPax += parseInt(t.res.pax || 2);

                const card = document.createElement('div');
                card.className = 'bg-stone-950 border border-stone-800 hover:border-amber-500/50 rounded-xl p-3 text-xs transition-all shadow-md group cursor-pointer';
                card.innerHTML = `
                    <div class="flex justify-between text-stone-400 text-[11px] font-mono mb-1">
                        <span>${t.res.timeStart} - ${t.res.timeEnd || '21:00'} • ${t.res.pax} Pax</span>
                        <span class="text-amber-500 font-bold">Tisch ${t.id}</span>
                    </div>
                    <div class="flex justify-between items-center my-1">
                        <h4 class="font-bold text-stone-100 text-sm group-hover:text-amber-400 transition-colors">${t.res.name}</h4>
                        <span class="bg-teal-500/10 text-teal-400 border border-teal-500/20 text-[10px] px-2 py-0.5 rounded-full font-medium">${t.res.badge || 'Bestätigt'}</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            document.getElementById('resCount').innerText = resCount;
            document.getElementById('totalPax').innerText = totalPax;
            document.getElementById('totalTables').innerText = `${resCount}/${tablesData.length}`;
        }

        function populateTableSelectOptions() {
            const select = document.getElementById('resTableSelect');
            select.innerHTML = '';
            tablesData.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.innerText = `Tisch ${t.id} (${t.pax} Pax) ${t.res ? '- Belegt' : '- Frei'}`;
                select.appendChild(opt);
            });
        }

        function openReservationModal() {
            document.getElementById('reservationModal').classList.remove('hidden');
        }

        function closeReservationModal() {
            document.getElementById('reservationModal').classList.add('hidden');
        }

        function saveReservation(e) {
            e.preventDefault();
            const name = document.getElementById('resName').value;
            const pax = document.getElementById('resPax').value;
            const tableId = document.getElementById('resTableSelect').value;
            const time = document.getElementById('resTime').value;

            const targetTable = tablesData.find(t => t.id === tableId);
            if (targetTable) {
                targetTable.res = {
                    name: name,
                    timeStart: time,
                    timeEnd: '21:00',
                    pax: pax,
                    badge: 'Neu',
                    badgeBg: 'bg-amber-500 text-slate-950'
                };
            }

            renderFloorPlan();
            closeReservationModal();
            document.getElementById('newReservationForm').reset();
        }

        function toggleCalendar() {
            document.getElementById('calendarModal').classList.toggle('hidden');
            renderCalendarGrid();
        }

        function toggleShiftDropdown() {
            document.getElementById('shiftDropdown').classList.toggle('hidden');
        }

        function selectShift(shiftName) {
            document.getElementById('currentShiftText').innerText = shiftName;
            document.getElementById('shiftDropdown').classList.add('hidden');
        }

        function updateDateDisplay() {
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('currentDateDisplay').innerText = selectedDate.toLocaleDateString('de-DE', options);
        }

        function changeDate(days) {
            selectedDate.setDate(selectedDate.getDate() + days);
            updateDateDisplay();
        }

        function renderCalendarGrid() {
            const daysGrid = document.getElementById('calendarDaysGrid');
            daysGrid.innerHTML = '';
            
            for (let i = 1; i <= 31; i++) {
                const dayBtn = document.createElement('button');
                dayBtn.className = `p-1.5 rounded-lg hover:bg-amber-500/20 hover:text-amber-400 ${i === selectedDate.getDate() ? 'bg-amber-500 text-stone-950 font-bold' : 'text-stone-300'}`;
                dayBtn.innerText = i;
                dayBtn.onclick = () => {
                    selectedDate.setDate(i);
                    updateDateDisplay();
                    document.getElementById('calendarModal').classList.add('hidden');
                };
                daysGrid.appendChild(dayBtn);
            }
        }

        renderFloorPlan();
        updateDateDisplay();
    </script>
</body>
</html>
